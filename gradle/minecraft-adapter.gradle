apply plugin: 'net.fabricmc.fabric-loom'

def hostLibraryName = System.getProperty('os.name').toLowerCase(Locale.ROOT).startsWith('windows')
        ? 'prime_engine.dll' : 'libprime_engine.so'

base { archivesName = "prime-pt-mc-${minecraftVersion}" }
dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    // Compile reproducibly; packaged Fabric dependencies accept compatible newer releases.
    implementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
    implementation project(':common')
}

def adapterArtifactVersion = project.version
processResources {
    inputs.property 'version', adapterArtifactVersion
    inputs.property 'minecraftVersion', minecraftVersion
    inputs.property 'fabricApiVersion', fabricApiVersion
    filesMatching('fabric.mod.json') {
        expand(version: adapterArtifactVersion, minecraftVersion: minecraftVersion, fabricApiVersion: fabricApiVersion)
    }
}

// Shared classes are compiled once. Each installable adapter JAR includes the common output.
def common = project(':common')
// Host APIs shared by these supported versions compile against each version's
// own Minecraft/Fabric classpath; version-specific bindings stay in the adapter.
sourceSets.main.java.srcDir(rootProject.file('adapters/minecraft-shared/src/main/java'))
sourceSets.test.java.srcDir(rootProject.file('adapters/minecraft-shared/src/testFixtures/java'))
sourceSets.test.java.srcDir(rootProject.file('adapters/minecraft-shared/src/test/java'))
sourceSets.test.compileClasspath += common.sourceSets.test.output
sourceSets.test.runtimeClasspath += common.sourceSets.test.output
tasks.named('compileTestJava') { dependsOn common.tasks.named('testClasses') }
// Fabric's development resource pack sees the adapter's output roots, not a
// plain Java dependency's resources. Use the same assets in dev and both JARs.
sourceSets.main.resources.srcDirs(common.sourceSets.main.resources.srcDirs)
tasks.named('jar') {
    dependsOn common.tasks.named('classes')
    from common.sourceSets.main.output.classesDirs
}
tasks.named('test') {
    dependsOn tasks.named('jar')
    systemProperty 'primept.test.adapterJar', tasks.named('jar').get().archiveFile.get().asFile.absolutePath
    systemProperty 'primept.test.minecraftVersion', minecraftVersion
    systemProperty 'primept.test.fabricApiVersion', fabricApiVersion
    systemProperty 'primept.test.loaderVersion', rootProject.loader_version
}
// Common resources already enter the adapter's own allSource through the resource roots above.
tasks.named('sourcesJar') { from common.sourceSets.main.allJava }

// Adapted shader source also lives in the embedded native binary.
tasks.withType(Jar).configureEach {
    from rootProject.file('LICENSE'), rootProject.file('LICENSE-EXCEPTIONS')
    from(rootProject.file('THIRD_PARTY_NOTICES.md')) { into 'META-INF' }
    from(rootProject.file('licenses')) { into 'META-INF/licenses' }
}

loom {
    runs {
        client {
            client()
            runDir = 'run'
            vmArgs '--enable-native-access=ALL-UNNAMED'
            vmArgs "-Dprimept.native.path=${providers.gradleProperty('nativeLibrary').getOrElse(rootProject.file("target/release/${hostLibraryName}").absolutePath)}"
            // Use the packaged runtime default unless explicitly overridden.
            if (providers.gradleProperty('primeptEnabled').isPresent())
                vmArgs "-Dprimept.enabled=${providers.gradleProperty('primeptEnabled').get()}"
            if (providers.gradleProperty('primeptRenderer').isPresent())
                vmArgs "-Dprimept.renderer=${providers.gradleProperty('primeptRenderer').get()}"
            vmArgs "-Dprimept.profile.leaves=${providers.gradleProperty('primeptProfileLeaves').getOrElse('false')}"
            vmArgs "-Dprimept.profile=${providers.gradleProperty('primeptProfile').getOrElse('false')}"
            if (providers.gradleProperty('primeptGeometryCache').isPresent())
                vmArgs "-Dprimept.geometryCache=${providers.gradleProperty('primeptGeometryCache').get()}"
            vmArgs "-Dprimept.capture.audit=${providers.gradleProperty('primeptCaptureAudit').getOrElse('false')}"
            if (providers.gradleProperty('primeptProfileCsv').isPresent()) vmArgs "-Dprimept.profile.csv=${providers.gradleProperty('primeptProfileCsv').get()}"
            programArgs '--graphicsBackend', 'VULKAN', '--width', '1920', '--height', '1080'
            if (providers.gradleProperty('primeptValidation').getOrElse('false').toBoolean()) programArgs '--vulkanValidation'
            if (providers.gradleProperty('primeptProfile').getOrElse('false').toBoolean()) environmentVariable 'PRIME_PROFILE', '1'
            if (providers.gradleProperty('primeptWorld').isPresent()) programArgs '--quickPlaySingleplayer', providers.gradleProperty('primeptWorld').get()
            if (providers.gradleProperty('primeptUsername').isPresent()) programArgs '--username', providers.gradleProperty('primeptUsername').get()
            if (providers.gradleProperty('primeptUuid').isPresent()) programArgs '--uuid', providers.gradleProperty('primeptUuid').get()
        }
    }
}

// Do not let a parallel run lock/load yesterday's DLL while buildNative replaces it.
// An explicitly supplied library is an immutable caller-owned build.
tasks.named('runClient') {
    if (!providers.gradleProperty('nativeLibrary').isPresent())
        dependsOn rootProject.tasks.named('buildNative')
}

tasks.register('nativeJar', Jar) {
    dependsOn classes, common.tasks.named('classes'), rootProject.tasks.named('buildNative')
    archiveClassifier = 'native'
    doFirst {
        if (!rootProject.file("target/release/${hostLibraryName}").isFile())
            throw new GradleException("Native build did not produce ${hostLibraryName}")
    }
    from sourceSets.main.output
    from common.sourceSets.main.output.classesDirs
    from(rootProject.file('target/release')) {
        include 'prime_engine.dll'
        into 'natives/windows-x86_64'
    }
    if (hostLibraryName == 'prime_engine.dll') {
        from(rootProject.file('third_party/streamline/bin/x64')) {
            include rootProject.streamlineRuntimeFiles
            into 'natives/windows-x86_64'
        }
    }
    from(rootProject.file('target/release')) {
        include 'libprime_engine.so'
        into 'natives/linux-x86_64'
    }
}

tasks.register('bundledNativeSmoke', JavaExec) {
    dependsOn common.tasks.named('testClasses'), tasks.named('nativeJar')
    // NativeSmoke uses only the JDK and packaged bridge. Do not resolve another
    // project's test dependencies from this adapter's task execution thread.
    classpath = files(tasks.named('nativeJar')) + common.sourceSets.test.output
    mainClass = 'dev.primept.NativeSmoke'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    args 'bundled', layout.buildDirectory.file('bundled-ffm-smoke.png').get().asFile.absolutePath
    if (minecraftVersion == '26.3') mustRunAfter ':mc-26.2:bundledNativeSmoke'
}

// A separate test mod exits its own JVM from Fabric preLaunch, before any window or GPU initialization.
sourceSets {
    cpuSmoke {
        java.srcDir rootProject.file('adapters/minecraft-shared/src/testFixtures/java')
        java.srcDir rootProject.file('adapters/section-tests/src/main/java')
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        compileClasspath += common.sourceSets.test.output
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
tasks.named('compileCpuSmokeJava') { dependsOn common.tasks.named('testClasses') }
tasks.register('cpuSmokeJar', Jar) {
    dependsOn tasks.named('cpuSmokeClasses')
    archiveClassifier = 'cpu-test'
    from sourceSets.cpuSmoke.output
}
tasks.register('cpuSmoke', JavaExec) {
    def smokeFlag = { String name ->
        String value = providers.gradleProperty(name).getOrElse('false').trim()
        if (!value.equalsIgnoreCase('true') && !value.equalsIgnoreCase('false'))
            throw new GradleException("${name} must be true or false: ${value}")
        value.equalsIgnoreCase('true')
    }
    boolean sectionSuite = smokeFlag('primeptSectionSuite')
    boolean targetResize = smokeFlag('primeptSmokeTargetResize')
    boolean foreign = smokeFlag('primeptSmokeForeign')
    boolean sectionBench = smokeFlag('primeptSectionBench')
    String registry = providers.gradleProperty('primeptSamplingRegistry').getOrElse('')
    String routingCost = providers.gradleProperty('primeptSmokeRoutingCost').getOrElse('')
    def selectors = []
    if (sectionSuite) selectors.add('section')
    if (targetResize) selectors.add('target_resize')
    if (foreign) selectors.add('foreign')
    if (!registry.isBlank()) selectors.add('sampling_registry')
    if (!routingCost.isBlank()) selectors.add('routing_cost')
    if (selectors.size() > 1)
        throw new GradleException("Conflicting CPU smoke selectors: ${selectors}")
    String selector = selectors.isEmpty() ? 'default' : selectors.first()
    if (sectionBench && !sectionSuite)
        throw new GradleException('primeptSectionBench=true requires primeptSectionSuite=true')
    boolean nativeRequired = selector in ['default', 'foreign', 'section']
    def manifest = layout.buildDirectory.file('cpu-smoke/result.json').get().asFile
    dependsOn tasks.named('classes'), tasks.named('cpuSmokeJar'), common.tasks.named('testClasses')
    if (nativeRequired && !providers.gradleProperty('primeptSectionNativeLibrary').isPresent())
        dependsOn rootProject.tasks.named(sectionSuite ? 'buildSectionBenchNative' : 'buildSourceCpuNative')
    classpath = sourceSets.main.runtimeClasspath + common.sourceSets.test.output
    mainClass = 'dev.primept.FabricCpuTestLauncher'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    systemProperty 'fabric.development', 'true'
    systemProperty 'primept.smoke.selector', selector
    systemProperty 'primept.smoke.manifest', manifest.absolutePath
    systemProperty 'primept.smoke.foreignWrapper', foreign.toString()
    systemProperty 'primept.smoke.routingCost', routingCost
    systemProperty 'primept.smoke.targetResize', targetResize.toString()
    systemProperty 'primept.smoke.namedOutput', providers.gradleProperty('primeptNamedOutput').map { rootProject.file(it).absolutePath }.getOrElse('')
    systemProperty 'primept.smoke.mcVersion', minecraftVersion
    systemProperty 'primept.sampling.registry', registry.isBlank() ? '' : rootProject.file(registry).absolutePath
    systemProperty 'primept.section.suite', sectionSuite.toString()
    systemProperty 'primept.section.bench', sectionBench.toString()
    systemProperty 'primept.section.threads', providers.gradleProperty('primeptSectionThreads').getOrElse('8')
    systemProperty 'primept.section.warmup', providers.gradleProperty('primeptSectionWarmup').getOrElse('8')
    systemProperty 'primept.section.samples', providers.gradleProperty('primeptSectionSamples').getOrElse('25')
    systemProperty 'primept.section.side', providers.gradleProperty('primeptSectionSide').getOrElse('2')
    systemProperty 'primept.section.tintSide', providers.gradleProperty('primeptSectionTintSide').getOrElse('2')
    systemProperty 'primept.smoke.routingDirectory', providers.gradleProperty('primeptSectionOutput').map { rootProject.file("${it}/mc-${minecraftVersion}").absolutePath }.getOrElse(layout.buildDirectory.dir('routing-fixtures').get().asFile.absolutePath)
    systemProperty 'primept.smoke.nativeLibrary', providers.gradleProperty('primeptSectionNativeLibrary').map { rootProject.file(it).absolutePath }.getOrElse(rootProject.file(sectionSuite ? "build/section-bench-native/release/${hostLibraryName}" : "build/source-cpu-native/debug/${hostLibraryName}").absolutePath)
    systemProperty 'fabric.addMods', tasks.named('cpuSmokeJar').get().archiveFile.get().asFile.absolutePath
    systemProperty 'fabric.classPathGroups', sourceSets.main.output.files.collect { it.absolutePath }.join(File.pathSeparator)
    workingDir layout.buildDirectory.dir('cpu-smoke')
    doFirst {
        workingDir.mkdirs()
        java.nio.file.Files.deleteIfExists(manifest.toPath())
    }
    doLast {
        if (!manifest.isFile()) throw new GradleException("CPU smoke did not write ${manifest}")
        def result = new groovy.json.JsonSlurper().parse(manifest)
        if (result.status != 'passed' || result.selector != selector || result.minecraft != minecraftVersion
                || result.count <= 0 || result.count != result.executed.size()
                || result.requested != result.executed)
            throw new GradleException("CPU smoke execution does not match its request: ${result}")
        logger.lifecycle("CPU smoke ${minecraftVersion}: ${result.executed}, ${result.count} completed fixture groups; ${manifest}")
    }
}
