plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'jacoco'
	id 'prime.shader-abi-conventions' apply false
	id 'prime.native-packaging-conventions' apply false
	id 'prime.architecture-conventions'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

def developmentGraphicsBackend = providers.gradleProperty('primeBackend').orElse('vulkan')

repositories {
	mavenCentral()
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

loom {
	splitEnvironmentSourceSets()
	accessWidenerPath = file('src/client/resources/prime.accesswidener')

	var streamlineSourceSets = sourceSets.maybeCreate("streamline")
	sourceSets.main.compileClasspath += streamlineSourceSets.output
	sourceSets.main.runtimeClasspath += streamlineSourceSets.output
	sourceSets.client.compileClasspath += streamlineSourceSets.output
	sourceSets.client.runtimeClasspath += streamlineSourceSets.output

	mods {
		prime {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
			sourceSet streamlineSourceSets
		}
	}

	runs {
		client {
			client()
			setConfigName('Prime Vulkan Client')
			ideConfigGenerated = true
			runDir = 'run'
			def selectedBackend = developmentGraphicsBackend.get().toLowerCase(java.util.Locale.ROOT)
			if (selectedBackend != 'vulkan' && selectedBackend != 'opengl') {
				throw new GradleException("primeBackend must be either 'vulkan' or 'opengl'")
			}
			programArgs '--graphicsBackend', selectedBackend
			if (selectedBackend == 'vulkan') {
				// Streamline broke it.
				// Fuck NVIDIA again.
				//programArgs '--vulkanValidation'
			}
		}
	}
}

// Loom stores the runClient JVM argument file under build/, which clean removes.
// Reusing that launch configuration otherwise leaves Java pointing at a stale path.
tasks.named('runClient') {
	notCompatibleWithConfigurationCache('Fabric Loom launch argument files are cleanable outputs')
}

apply plugin: 'prime.shader-abi-conventions'
apply plugin: 'prime.native-packaging-conventions'

def testSupportSourceSet = sourceSets.create('testSupport')
def benchmarkSourceSet = sourceSets.create('benchmark')

def clientJavaClasses = files(tasks.named('compileClientJava').flatMap { it.destinationDirectory })
testSupportSourceSet.compileClasspath = files(
		sourceSets.main.output,
		sourceSets.client.compileClasspath,
		configurations.testSupportCompileClasspath,
		clientJavaClasses)
testSupportSourceSet.runtimeClasspath = files(
		testSupportSourceSet.output,
		sourceSets.main.output,
		configurations.testSupportRuntimeClasspath,
		configurations.clientRuntimeClasspath,
		clientJavaClasses)
benchmarkSourceSet.compileClasspath = files(
		sourceSets.main.output,
		sourceSets.client.compileClasspath,
		configurations.benchmarkCompileClasspath,
		clientJavaClasses,
		testSupportSourceSet.output)
benchmarkSourceSet.runtimeClasspath = files(
		benchmarkSourceSet.output,
		testSupportSourceSet.output,
		sourceSets.main.output,
		configurations.benchmarkRuntimeClasspath,
		configurations.clientRuntimeClasspath,
		clientJavaClasses)
sourceSets.test.compileClasspath += testSupportSourceSet.output
sourceSets.test.runtimeClasspath += testSupportSourceSet.output

sourceSets.test.compileClasspath += sourceSets.streamline.output
sourceSets.test.runtimeClasspath += sourceSets.streamline.output
tasks.withType(Test).configureEach {
	// Configuration classes expose Streamline enums; add only compiled bindings, not client resources.
	classpath += sourceSets.streamline.output
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	[
			'fabric-model-loading-api-v1',
			'fabric-renderer-api-v1',
			'fabric-renderer-indigo',
			'fabric-rendering-v1',
			'fabric-resource-loader-v1',
			'fabric-command-api-v2'
	].each { module ->
		implementation fabricApi.module(module, project.fabric_api_version)
	}
	// Optional local profiler; keep it out of production and correctness-test closures.
	if (providers.gradleProperty('primeSpark').map { it.toBoolean() }.getOrElse(false)) {
		// https://modrinth.com/mod/spark/version/1.10.173-fabric
		modLocalRuntime "maven.modrinth:l6YH9Als:iYFOl6lQ"
	}

	testImplementation platform('org.junit:junit-bom:6.1.3')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testImplementation 'org.jetbrains:jetCheck:0.3.0'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	benchmarkImplementation 'org.openjdk.jmh:jmh-core:1.37'
	benchmarkAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
}

tasks.named('compileTestSupportJava') {
	dependsOn tasks.named('compileClientJava')
}

tasks.named('compileBenchmarkJava') {
	dependsOn tasks.named('compileClientJava'), tasks.named('testSupportClasses')
}

tasks.named('compileTestJava') {
	dependsOn tasks.named('compileClientJava'), tasks.named('testSupportClasses')
}

def translationBenchmarkReportDirectory =
		layout.buildDirectory.dir('reports/benchmarks').get().asFile
def translationBenchmarkResult =
		new File(translationBenchmarkReportDirectory, 'translation.json')
tasks.register('translationBenchmark', JavaExec) {
	group = 'benchmark'
	description = 'Runs the correctness-gated typical/extreme cluster translation JMH baseline.'
	dependsOn tasks.named('benchmarkClasses'), tasks.named('test')
	classpath = benchmarkSourceSet.runtimeClasspath
	mainClass = 'org.openjdk.jmh.Main'
	args 'dev.prime.render.terrain.ClusterTranslationBenchmark',
			'-wi', '5', '-i', '10', '-f', '2',
			'-w', '500ms', '-r', '1s', '-foe', 'true',
			'-rf', 'json', '-rff',
			translationBenchmarkResult.absolutePath
	outputs.file(translationBenchmarkResult)
	outputs.upToDateWhen { false }
	doFirst {
		translationBenchmarkReportDirectory.mkdirs()
	}
}

jacoco {
	toolVersion = '0.8.15'
}

tasks.named('jacocoTestReport', JacocoReport) {
	dependsOn tasks.named('test'), tasks.named('artifactTest')
	executionData.setFrom(files(
			layout.buildDirectory.file('jacoco/test.exec'),
			layout.buildDirectory.file('jacoco/artifactTest.exec')))
	sourceDirectories.setFrom(files('src/client/java'))
	classDirectories.setFrom(sourceSets.client.output.classesDirs.collect { directory ->
		fileTree(directory) {
			exclude 'dev/prime/render/shader/ShaderAbi*.class'
			exclude 'dev/prime/render/vulkan/GeneratedShaderPrograms*.class'
		}
	})
	reports {
		xml.required = true
		html.required = true
		csv.required = false
	}
}


def resourceVersion = project.version.toString()
processResources {
	inputs.property 'version', resourceVersion
	filesMatching('fabric.mod.json') {
		expand version: resourceVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
	options.compilerArgs += ['-Xlint:all', '-Werror']
}


java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}


tasks.named('check') {
	dependsOn 'verifyDistributionJar', 'verifyRoboCuteReference'
}

publishing {
	publications {
		create('mavenJava', MavenPublication) {
			from components.java
		}
	}
}
