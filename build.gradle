plugins {
    id 'base'
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

allprojects {
    version = rootProject.mod_version
    group = 'dev.primept'
    repositories { mavenCentral() }
}

// Development/build verification only; packaged players never execute these tasks.
tasks.register('testAbiGenerator', Exec) {
    group = 'verification'
    description = 'Run ABI generator behavior fixtures with real C/Rust compilers, without GPU.'
    workingDir rootDir
    environment 'PRIME_ABI_C_COMPILER', providers.gradleProperty('abiCompiler').getOrElse('clang')
    commandLine providers.gradleProperty('abiPython').getOrElse('python'),
            'scripts/test_generate_abi.py'
}
tasks.register('checkAbi', Exec) {
    group = 'verification'
    description = 'Check generated ABI freshness and independent C11 layout/signatures without changing files.'
    dependsOn tasks.named('testAbiGenerator')
    workingDir rootDir
    commandLine providers.gradleProperty('abiPython').getOrElse('python'),
            'scripts/generate-abi.py', '--check', '--probe',
            providers.gradleProperty('abiCompiler').getOrElse('clang')
}
tasks.named('check') { dependsOn tasks.named('checkAbi') }

subprojects {
    apply plugin: 'java-library'
    java {
        toolchain.languageVersion = JavaLanguageVersion.of(25)
        withSourcesJar()
    }
    tasks.withType(JavaCompile).configureEach {
        options.release = 25
        options.encoding = 'UTF-8'
    }
    dependencies {
        testImplementation platform('org.junit:junit-bom:5.13.4')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    tasks.withType(Test).configureEach {
        dependsOn rootProject.tasks.named('checkAbi')
        useJUnitPlatform()
        jvmArgs '--enable-native-access=ALL-UNNAMED'
    }
}

// One native engine is shared byte-for-byte by both Minecraft adapters.
ext.streamlineRuntimeFiles = ['sl.interposer.dll', 'sl.common.dll', 'sl.dlss_d.dll', 'nvngx_dlssd.dll',
                             'sl.dlss_g.dll', 'sl.pcl.dll', 'sl.reflex.dll', 'nvngx_dlssg.dll', 'NvLowLatencyVk.dll']
tasks.register('stageStreamlineRuntime', Copy) {
    onlyIf { System.getProperty('os.name').toLowerCase(Locale.ROOT).startsWith('windows') }
    from('third_party/streamline/bin/x64') { include rootProject.streamlineRuntimeFiles }
    into 'target/release'
    doFirst {
        rootProject.streamlineRuntimeFiles.each { name ->
            if (!rootProject.file("third_party/streamline/bin/x64/${name}").isFile())
                throw new GradleException("Missing Streamline runtime ${name}; restore the pinned SDK runtime")
        }
    }
}
tasks.register('buildNative', Exec) {
    dependsOn tasks.named('stageStreamlineRuntime'), tasks.named('checkAbi')
    workingDir rootDir
    commandLine 'cargo', 'build', '--release', '--locked', '--package', 'prime_engine'
}

// Isolated CPU library: never attaches Vulkan or replaces a DLL used by a running game.
tasks.register('buildSourceCpuNative', Exec) {
    dependsOn tasks.named('checkAbi')
    workingDir rootDir
    commandLine 'cargo', 'build', '--locked', '--no-default-features', '--package', 'prime_engine', '--target-dir', rootProject.file('build/source-cpu-native').absolutePath
}

// Benchmark only: optimized CPU engine, physically separate from smoke and game libraries.
tasks.register('buildSectionBenchNative', Exec) {
    dependsOn tasks.named('checkAbi')
    workingDir rootDir
    commandLine 'cargo', 'build', '--release', '--locked', '--no-default-features', '--package', 'prime_engine', '--target-dir', rootProject.file('build/section-bench-native').absolutePath
}

def adapters = [':mc-26.2', ':mc-26.3']
tasks.register('test') { dependsOn subprojects.collect { "${it.path}:test" } }
tasks.named('build') { dependsOn subprojects.collect { "${it.path}:build" } }
tasks.named('clean') { dependsOn subprojects.collect { "${it.path}:clean" } }
tasks.register('nativeJar') { dependsOn adapters.collect { "${it}:nativeJar" } }
def nativeJarAdapters = adapters.collect { project(it) }
def nativeJarVerificationRoot = rootProject.projectDir
tasks.register('verifyNativeJars') {
    dependsOn tasks.named('nativeJar')
    doLast {
        String entryName = System.getProperty('os.name').toLowerCase(Locale.ROOT).startsWith('windows')
                ? 'natives/windows-x86_64/prime_engine.dll' : 'natives/linux-x86_64/libprime_engine.so'
        byte[] referenceNative = null
        byte[] referenceBridge = null
        nativeJarAdapters.each { adapter ->
            def archive = adapter.tasks.named('nativeJar').get().archiveFile.get().asFile
            new java.util.zip.ZipFile(archive).withCloseable { zip ->
                def nativeEntry = zip.getEntry(entryName)
                def bridgeEntry = zip.getEntry('dev/primept/NativeBridge.class')
                if (nativeEntry == null || bridgeEntry == null) throw new GradleException("Missing engine/common classes in ${archive}")
                byte[] nativeBytes = zip.getInputStream(nativeEntry).withCloseable { it.readAllBytes() }
                byte[] bridgeBytes = zip.getInputStream(bridgeEntry).withCloseable { it.readAllBytes() }
                if (nativeBytes.length == 0) throw new GradleException("Empty native engine in ${archive}")
                if (entryName.startsWith('natives/windows-')) {
                    rootProject.streamlineRuntimeFiles.each { name ->
                        String runtimePath = "natives/windows-x86_64/${name}"
                        def runtimeEntry = zip.getEntry(runtimePath)
                        if (runtimeEntry == null || Collections.list(zip.entries()).count { it.name == runtimePath } != 1)
                            throw new GradleException("Missing or duplicated ${runtimePath} in ${archive}")
                        byte[] actual = zip.getInputStream(runtimeEntry).withCloseable { it.readAllBytes() }
                        if (!Arrays.equals(new File(nativeJarVerificationRoot, "third_party/streamline/bin/x64/${name}").bytes, actual))
                            throw new GradleException("Mismatched ${runtimePath} in ${archive}")
                    }
                }
                ['en_us', 'zh_cn'].each { locale ->
                    String asset = "assets/primept/lang/${locale}.json"
                    def entry = zip.getEntry(asset)
                    if (entry == null || Collections.list(zip.entries()).count { it.name == asset } != 1)
                        throw new GradleException("Missing or duplicated ${asset} in ${archive}")
                    byte[] actual = zip.getInputStream(entry).withCloseable { it.readAllBytes() }
                    if (!Arrays.equals(new File(nativeJarVerificationRoot, "adapters/common/src/main/resources/${asset}").bytes, actual))
                        throw new GradleException("Mismatched ${asset} in ${archive}")
                }
                def notices = ['LICENSE', 'LICENSE-EXCEPTIONS', 'META-INF/THIRD_PARTY_NOTICES.md']
                fileTree(new File(nativeJarVerificationRoot, 'licenses')).files.sort().each { license ->
                    String relative = new File(nativeJarVerificationRoot, 'licenses').toPath()
                            .relativize(license.toPath()).toString().replace('\\', '/')
                    notices.add("META-INF/licenses/${relative}")
                }
                notices.each { name ->
                    def entry = zip.getEntry(name)
                    if (entry == null || Collections.list(zip.entries()).count { it.name == name } != 1)
                        throw new GradleException("Missing or duplicated ${name} in ${archive}")
                    byte[] actual = zip.getInputStream(entry).withCloseable { it.readAllBytes() }
                    String source = name.startsWith('META-INF/') ? name.substring('META-INF/'.length()) : name
                    if (!Arrays.equals(new File(nativeJarVerificationRoot, source).bytes, actual)) throw new GradleException("Mismatched ${name} in ${archive}")
                }
                if (referenceNative != null && !Arrays.equals(referenceNative, nativeBytes)) throw new GradleException('Adapters packaged different native engines')
                if (referenceBridge != null && !Arrays.equals(referenceBridge, bridgeBytes)) throw new GradleException('Adapters packaged different common bridge classes')
                referenceNative = nativeBytes
                referenceBridge = bridgeBytes
                def metadata = zip.getInputStream(zip.getEntry('fabric.mod.json')).withCloseable {
                    new groovy.json.JsonSlurper().parse(it)
                }
                if (metadata.depends.minecraft != "=${adapter.minecraftVersion}") throw new GradleException("Wrong Minecraft constraint in ${archive}")
                if (metadata.depends.'fabric-api' != ">=${adapter.fabricApiVersion}") throw new GradleException("Wrong Fabric API minimum in ${archive}")
                if (metadata.depends.fabricloader != '>=0.19.0') throw new GradleException("Wrong Fabric Loader minimum in ${archive}")
                logger.lifecycle("Verified ${archive.name}: Minecraft ${adapter.minecraftVersion}, common FFM classes, ${nativeBytes.length}-byte shared engine")
            }
        }
    }
}
tasks.register('nativeSmoke') { dependsOn ':common:nativeSmoke' }
tasks.register('bundledNativeSmoke') { dependsOn ':mc-26.2:bundledNativeSmoke', ':mc-26.3:bundledNativeSmoke' }
// The explicit version tasks isolate game files; this alias retains the previous 26.2 workflow.
tasks.register('runClient') { dependsOn ':mc-26.2:runClient' }
tasks.register('runClient26_2') { dependsOn ':mc-26.2:runClient' }
tasks.register('runClient26_3') { dependsOn ':mc-26.3:runClient' }
