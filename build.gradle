plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'jacoco'
	id 'prime.shader-abi-conventions' apply false
	id 'prime.native-packaging-conventions' apply false
	id 'prime.architecture-conventions'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

def developmentGraphicsBackend = providers.gradleProperty('primeBackend').orElse('vulkan')

repositories {
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()
	accessWidenerPath = file('src/client/resources/prime.accesswidener')

	mods {
		prime {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		client {
			client()
			setConfigName('Prime Vulkan Client')
			ideConfigGenerated = true
			runDir = 'run'
			def selectedBackend = developmentGraphicsBackend.get().toLowerCase(java.util.Locale.ROOT)
			if (selectedBackend != 'vulkan' && selectedBackend != 'opengl') {
				throw new GradleException("primeBackend must be either 'vulkan' or 'opengl'")
			}
			programArgs '--graphicsBackend', selectedBackend
			if (selectedBackend == 'vulkan') {
				programArgs '--vulkanValidation'
			}
		}
	}
}

// Loom stores the runClient JVM argument file under build/, which clean removes.
// Reusing that launch configuration otherwise leaves Java pointing at a stale path.
tasks.named('runClient') {
	notCompatibleWithConfigurationCache('Fabric Loom launch argument files are cleanable outputs')
}

apply plugin: 'prime.shader-abi-conventions'
apply plugin: 'prime.native-packaging-conventions'

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	[
			'fabric-model-loading-api-v1',
			'fabric-renderer-api-v1',
			'fabric-renderer-indigo',
			'fabric-rendering-v1',
			'fabric-resource-loader-v1'
	].each { module ->
		implementation fabricApi.module(module, project.fabric_api_version)
	}

	testImplementation platform('org.junit:junit-bom:6.1.3')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testImplementation 'org.jetbrains:jetCheck:0.3.0'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

jacoco {
	toolVersion = '0.8.15'
}

tasks.named('jacocoTestReport', JacocoReport) {
	dependsOn tasks.named('test'), tasks.named('artifactTest')
	executionData.setFrom(files(
			layout.buildDirectory.file('jacoco/test.exec'),
			layout.buildDirectory.file('jacoco/artifactTest.exec')))
	sourceDirectories.setFrom(files('src/client/java'))
	classDirectories.setFrom(sourceSets.client.output.classesDirs.collect { directory ->
		fileTree(directory) {
			exclude 'dev/prime/render/shader/ShaderAbi*.class'
			exclude 'dev/prime/render/vulkan/GeneratedShaderPrograms*.class'
		}
	})
	reports {
		xml.required = true
		html.required = true
		csv.required = false
	}
}


tasks.named('compileTestJava') {
	dependsOn tasks.named('compileClientJava')
}

def resourceVersion = project.version.toString()
processResources {
	inputs.property 'version', resourceVersion
	filesMatching('fabric.mod.json') {
		expand version: resourceVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
	options.compilerArgs += ['-Xlint:all', '-Werror']
}


java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}


tasks.named('check') {
	dependsOn 'verifyDistributionJar', 'verifyRoboCuteReference'
}

publishing {
	publications {
		create('mavenJava', MavenPublication) {
			from components.java
		}
	}
}
