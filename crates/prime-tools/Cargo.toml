[package]
license.workspace = true
name = "prime_tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "CPU capture-protocol benchmarks, native-1080p GPU fixtures and image diagnostics"

[features]
default = ["vulkan"]
vulkan = ["dep:prime_vulkan", "dep:png"]

[dependencies]
mimalloc.workspace = true
prime_scene.workspace = true
prime_vulkan = { workspace = true, optional = true }
png = { workspace = true, optional = true }

[[bin]]
name = "prime-pt-smoke"
path = "src/smoke.rs"

[[bin]]
name = "perf"
path = "src/perf.rs"

[[bin]]
name = "capture-cpu"
path = "src/capture_cpu.rs"

[[bin]]
name = "instance-cpu"
path = "src/instance_cpu.rs"

[lints]
workspace = true
