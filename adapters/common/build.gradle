base { archivesName = 'prime-common' }
sourceSets.test.java.srcDir('src/testFixtures/java')
dependencies { testImplementation 'com.google.code.gson:gson:2.14.0' }

// CPU-only real Java capture/FFM/native transaction. Use a fresh JVM per DLL comparison.
tasks.register('instanceSubmitPerf', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.primept.InstanceSubmitPerf'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    args providers.gradleProperty('nativeLibrary').getOrElse(rootProject.file('target/release/prime_engine.dll').absolutePath)
    args providers.gradleProperty('instanceObjects').getOrElse('56133')
    args providers.gradleProperty('instanceWarmup').getOrElse('64')
    args providers.gradleProperty('instanceSamples').getOrElse('120')
    args providers.gradleProperty('instanceCsv').getOrElse(rootProject.file('artifacts/instance-submit.csv').absolutePath)
}

tasks.register('nativeSmoke', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.primept.NativeSmoke'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    String library = System.getProperty('os.name').toLowerCase(Locale.ROOT).startsWith('windows')
            ? 'prime_engine.dll' : 'libprime_engine.so'
    args providers.gradleProperty('nativeLibrary').getOrElse(rootProject.file("target/debug/${library}").absolutePath)
    args layout.buildDirectory.file('ffm-smoke.png').get().asFile.absolutePath
}

// Actual FFM diagnostics ownership/UTF-8 contract, without attaching or creating a Vulkan device.
tasks.register('cpuDiagnosticsSmoke', JavaExec) {
    dependsOn testClasses
    if (!providers.gradleProperty('nativeLibrary').isPresent())
        dependsOn rootProject.tasks.named('buildSourceCpuNative')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.primept.CpuDiagnosticsSmoke'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    String library = System.getProperty('os.name').toLowerCase(Locale.ROOT).startsWith('windows')
            ? 'prime_engine.dll' : 'libprime_engine.so'
    args providers.gradleProperty('nativeLibrary')
            .map { rootProject.file(it).absolutePath }
            .getOrElse(rootProject.file("build/source-cpu-native/debug/${library}").absolutePath)
}
