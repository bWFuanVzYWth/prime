		spirvValidator = productionSpirvValidator
		debugLevel = productionShaderDebug
		canonicalWorkspacePath = rootProject.layout.projectDirectory.asFile.canonicalPath
		outputFile = output
		dependencyFile = layout.buildDirectory.file(
				"shaderPrograms/${id}/${artifact.resource}.d")
		metricsFile = layout.buildDirectory.file(
				"reports/prime-shaders/programs/${id}.json")
	}
	compiledProgramFiles.from(compileProgram.flatMap { it.outputFile })
}

