	include '*.slang'
}
def verifyShaderTestManifest = tasks.register('verifyShaderTestManifest') {
	group = 'verification'
	description = 'Verifies that every test Slang entry has one declared runtime or compile-only artifact.'
	inputs.file(shaderTestProgramManifest)
	inputs.files(shaderTestEntryFiles)
	outputs.file(shaderTestManifestReport)
	doLast {
		def manifest = new groovy.json.JsonSlurper().parse(shaderTestProgramManifest)
		if (!(manifest.programs instanceof List)) {
			throw new GradleException('Shader test manifest must contain a programs array')
		}
		def entries = manifest.programs.collect { program -> program.entry?.toString() }
		def artifacts = manifest.programs.collect { program -> program.artifact?.toString() }
		def modes = manifest.programs.collect { program -> program.mode?.toString() }
		if (entries.any { it == null } || artifacts.any { it == null } || modes.any { it == null }) {
			throw new GradleException('Every Shader test program requires entry, artifact, and mode')
		}
		if (entries.size() != entries.toSet().size()) {
			throw new GradleException('Shader test manifest contains duplicate entries')
		}
		if (artifacts.size() != artifacts.toSet().size()) {
			throw new GradleException('Shader test manifest contains duplicate artifacts')
		}
		def invalidModes = modes.findAll { !(it in ['runtime', 'compile-only']) }
		if (!invalidModes.empty) {
			throw new GradleException("Shader test manifest contains invalid modes: ${invalidModes}")
		}
		manifest.programs.each { program ->
			def expectedArtifact
			if (program.entry.endsWith('.compute.slang')) {
				expectedArtifact = program.entry.replace('.compute.slang', '.comp.spv')
			} else if (program.entry.endsWith('.raygeneration.slang')) {
				expectedArtifact = program.entry.replace('.raygeneration.slang', '.rgen.spv')
			} else if (program.entry.endsWith('.miss.slang')) {
				expectedArtifact = program.entry.replace('.miss.slang', '.rmiss.spv')
			} else if (program.entry.endsWith('.closesthit.slang')) {
				expectedArtifact = program.entry.replace('.closesthit.slang', '.rchit.spv')
			} else if (program.entry.endsWith('.anyhit.slang')) {
				expectedArtifact = program.entry.replace('.anyhit.slang', '.rahit.spv')
			} else {
				throw new GradleException("Unsupported Shader test entry stage: ${program.entry}")
			}
			if (program.artifact != expectedArtifact) {
				throw new GradleException(
						"Shader test artifact mismatch for ${program.entry}: expected ${expectedArtifact}, found ${program.artifact}")
			}
		}
		def actualEntries = shaderTestEntryFiles.files.collect { it.name }.sort()
		def declaredEntries = entries.sort()
		if (actualEntries != declaredEntries) {
			throw new GradleException(
					"Shader test manifest entries differ: declared=${declaredEntries}, actual=${actualEntries}")
		}
		def runtimeCount = modes.count { it == 'runtime' }
		def compileOnlyCount = modes.count { it == 'compile-only' }
		def report = shaderTestManifestReport.get().asFile
		report.parentFile.mkdirs()
		report.setText(
				"runtime=${runtimeCount}${System.lineSeparator()}compile-only=${compileOnlyCount}${System.lineSeparator()}" +
						manifest.programs.collect { "${it.mode} ${it.entry} -> ${it.artifact}" }.join(System.lineSeparator()) +
						System.lineSeparator(),
				'UTF-8')
	}
}

