def verifyShaderIncludeGraph = tasks.register('verifyShaderIncludeGraph') {
	group = 'verification'
	description = 'Verifies that Prime Slang includes and path imports are resolvable and acyclic.'
	dependsOn generateShaderAbi, generateRendererDataContracts
	inputs.files(
			fileTree('shaders'),
			fileTree('src/test/slang'),
			shaderAbiSlangRoot,
			rendererDataSlangRoot)
	outputs.file(shaderIncludeReport)

	doLast {
		def removedReferencePaths = removedShaderReferencePaths.findAll { it.exists() }
		if (!removedReferencePaths.empty) {
			throw new GradleException(
					"Removed local RoboCute reference code was restored: ${removedReferencePaths}")
		}
		def sources = []
		def shaderRoot = shaderSourceRoot.canonicalFile
		def includeRoots = [
				shaderRoot,
				shaderTestIncludeRoot,
				shaderAbiSlangRoot.get().asFile,
				rendererDataSlangRoot.get().asFile
		]
		includeRoots.each { root ->
			if (root.isDirectory()) {
				root.eachFileRecurse(groovy.io.FileType.FILES) { source ->
					if (source.name.endsWith('.slang') || source.name.endsWith('.h')) {
						sources.add(source)
					}
				}
			}
		}
		def sourcePaths = sources.collect { it.canonicalFile }.toSet()
		def modulePattern = java.util.regex.Pattern.compile(
				'(?m)^\s*module\s+"[^"]+"\s*;')
		def modulePaths = sources.findAll { source ->
			modulePattern.matcher(source.getText('UTF-8')).find()
		}.collect { it.canonicalPath }.toSet()
		def graph = new TreeMap<String, Set<String>>()
		def dependencyPattern = java.util.regex.Pattern.compile(
				'(?m)^\\s*(?:#\\s*include\\s+"([^"]+)"|import\\s+"([^"]+)"\\s*;)')
		sources.each { source ->
			def sourceName = source.canonicalPath
			def targets = graph.computeIfAbsent(sourceName) { new TreeSet<String>() }
			def matcher = dependencyPattern.matcher(source.getText('UTF-8'))
			while (matcher.find()) {
				def includeDependency = matcher.group(1) != null
				def dependencyName = matcher.group(1) ?: matcher.group(2)
				def candidates = ([new File(source.parentFile, dependencyName)]
						+ includeRoots.collect { new File(it, dependencyName) })
						.collect { it.canonicalFile }
						.findAll { sourcePaths.contains(it) }
						.unique()
				if (candidates.empty) {
					throw new GradleException(
							"Unresolved shader dependency ${dependencyName} from ${source}")
				}
				if (candidates.size() != 1) {
					throw new GradleException(
							"Ambiguous shader dependency ${dependencyName} from ${source}: ${candidates}")
				}
				if (includeDependency
						&& modulePaths.contains(candidates.first().canonicalPath)) {
					throw new GradleException(
							"Explicit shader module ${dependencyName} must be imported, not included, from ${source}")
				}
				targets.add(candidates.first().canonicalPath)
			}
		}

		def state = new HashMap<String, Integer>()
		def stack = []
		Closure<Void> visit
		visit = { String source ->
			if (state[source] == 1) {
				int start = stack.indexOf(source)
				def cycle = stack.subList(start, stack.size()) + source
				throw new GradleException(
						"Shader dependency cycle: ${cycle.join(' -> ')}")
			}
			if (state[source] == 2) {
				return
			}
			state[source] = 1
			stack.add(source)
			(graph[source] ?: Collections.emptySet()).each { visit(it) }
			stack.remove(stack.size() - 1)
			state[source] = 2
		}
		graph.keySet().each { visit(it) }

		def report = shaderIncludeReport.get().asFile
		report.parentFile.mkdirs()
		report.setText(
				graph.collectMany { source, targets ->
					targets.collect { "${source} -> ${it}" }
				}.join(System.lineSeparator()) + System.lineSeparator(),
				'UTF-8')
	}
}

def defaultSlangCompilerProcesses = providers.provider {
	def processors = Math.max(1, Runtime.runtime.availableProcessors())
	long gibibyte = 1024L * 1024L * 1024L
	long physicalMemory = 16L * gibibyte
	def operatingSystem = java.lang.management.ManagementFactory.operatingSystemMXBean
	if (operatingSystem instanceof com.sun.management.OperatingSystemMXBean) {
		physicalMemory = operatingSystem.totalMemorySize
	}
	// The largest wavefront entry points can make one slangc process consume several GiB.
	// Keep enough host memory for Gradle and the desktop while exploiting high-memory machines.
	// Twelve GiB keeps the desktop and Gradle responsive while allowing four measured worst-case
	// compiler processes; smaller machines still retain at least half their memory or 8 GiB.
	def reservedMemory = Math.max(
			8L * gibibyte,
			Math.min(12L * gibibyte, physicalMemory.intdiv(2L)))
	def compilerMemory = Math.max(0L, physicalMemory - reservedMemory)
	// The pinned Slang toolchain can commit roughly 12 GiB while optimizing a fully specialized
	// wavefront entry point. This is a build-wide budget: production and test tasks share the gate.
	def compilerProcessMemory = 12L * gibibyte
	def memoryBound = Math.max(1, (int) compilerMemory.intdiv(compilerProcessMemory))
	return Math.max(1, Math.min(12, Math.min(processors, memoryBound)))
}
def slangCompilerProcesses = providers.gradleProperty('primeSlangCompilerWorkers')
		.map { value ->
			def count = Integer.parseInt(value)
			if (count < 1) {
				throw new GradleException('primeSlangCompilerWorkers must be positive')
			}
			return count
		}
		.orElse(defaultSlangCompilerProcesses)

def shaderTestManifestReport = layout.buildDirectory.file(
		'reports/prime-shaders/test-programs.txt')
