programManifest.artifacts.each { String id, artifact ->
	def taskName = 'compileSlangProgram' + id.split('_').collect { part ->
		part.capitalize()
	}.join('')
	def source = file(artifact.source)
	def output = layout.buildDirectory.file(
			"shaderPrograms/${id}/${artifact.resource}")
	def compileProgram = tasks.register(
			taskName, primeShaderTaskTypes.compileProgram) {
		group = 'build'
		description = "Compiles the ${id} production Slang artifact."
		dependsOn generateShaderAbi, verifyRoboCuteReference,
				verifyShaderArchitecture, 'verifySlangToolchain'
		usesService compilerGate
		sourceFile = source
		shaderDependencies.from(objects.newInstance(
				primeShaderTaskTypes.dependencyClosure, source, productionShaderIncludes))
		includeDirectories.from(productionShaderIncludes)
		artifactId = id
		stage = artifact.stage
		definitions = artifact.definitions ?: []
		slangCompiler = productionSlangCompiler
