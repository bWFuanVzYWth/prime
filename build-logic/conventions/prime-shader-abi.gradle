def verifyCompiledShaderTestManifest = tasks.register('verifyCompiledShaderTestManifest') {
	group = 'verification'
	description = 'Verifies that compiled test SPIR-V exactly matches the declared test program manifest.'
	dependsOn compileSlangTestShaders
	inputs.file(shaderTestProgramManifest)
	inputs.dir(compiledSlangTestShaderRoot)
	outputs.file(compiledShaderTestManifestReport)
	doLast {
		def manifest = new groovy.json.JsonSlurper().parse(shaderTestProgramManifest)
		def declared = manifest.programs.collect { it.artifact.toString() }.sort()
		def artifactDirectory = new File(compiledSlangTestShaderRoot.get().asFile, 'prime/shaders')
		def actual = artifactDirectory.listFiles()
				.findAll { it.name.endsWith('.spv') }
				.collect { it.name }
				.sort()
		if (actual != declared) {
			throw new GradleException(
					"Compiled Shader test artifacts differ: declared=${declared}, actual=${actual}")
		}
		def report = compiledShaderTestManifestReport.get().asFile
		report.parentFile.mkdirs()
		report.setText(actual.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
	}
}

