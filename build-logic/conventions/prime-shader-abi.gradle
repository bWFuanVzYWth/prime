def verifyRoboCuteReference = tasks.register('verifyRoboCuteReference') {
	group = 'verification'
	description = 'Verifies the pinned third-party RoboCute reference and immutable author overlay.'
	def lockFile = file('shaders/robocute.lock.json')
	def authorityOverlayDirectory =
			file('third_party/robocute/author-bsdf-hotfix-2026-07-24')
	def authorityOverlayFiles = fileTree(authorityOverlayDirectory) {
		include '*.hpp', '*.bytes'
	}
	inputs.file(lockFile)
	inputs.files(authorityOverlayFiles)

	doLast {
		def lock = new groovy.json.JsonSlurper().parse(lockFile)
		if (lock.repository != 'https://github.com/RoboCute/RoboCute'
				|| lock.commit != '0d982c77b3fd26c2c5a3c0852be3bd05e5860bd8') {
			throw new GradleException('RoboCute lock must name the approved repository and commit')
		}
		def overlay = lock.authorityOverlay
		if (overlay == null
				|| overlay.path != 'third_party/robocute/author-bsdf-hotfix-2026-07-24') {
			throw new GradleException('RoboCute lock must name the approved author hotfix overlay')
		}
		def expectedOverlay = new TreeSet<String>(overlay.files.keySet())
		def actualOverlay = new TreeSet<String>(authorityOverlayFiles.files.collect { it.name })
		if (actualOverlay != expectedOverlay) {
			throw new GradleException(
					"RoboCute author hotfix file set changed: expected ${expectedOverlay}, found ${actualOverlay}")
		}
		authorityOverlayFiles.files.each { source ->
			def digest = java.security.MessageDigest.getInstance('SHA-256')
					.digest(source.bytes).encodeHex().toString()
			if (digest != overlay.files[source.name]) {
				throw new GradleException(
						"RoboCute author hotfix changed: ${source.name}")
			}
		}
	}
}









def resolveVulkanTool = { String name ->
	def windows = System.getProperty('os.name').toLowerCase(java.util.Locale.ROOT).contains('win')
	def extension = windows ? '.exe' : ''
	def sdk = System.getenv('VULKAN_SDK')
	if (sdk) {
		def binDirectories = windows ? ['Bin', 'bin'] : ['bin', 'Bin']
		for (def binDirectory : binDirectories) {
			def candidate = file("${sdk}/${binDirectory}/${name}${extension}")
			if (candidate.exists()) {
				return candidate.absolutePath
			}
		}
	}
	return "${name}${extension}"
}

