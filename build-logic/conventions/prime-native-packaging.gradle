// Prime licensing and additional permissions: see LICENSE and LICENSE-EXCEPTIONS.

def licenseArchiveSuffix = project.name
def shaderManifestType = primeShaderManifestType
def streamlineOutput = sourceSets.getByName('streamline').output
def streamlineOutputRoots = streamlineOutput.files.collect { it.absoluteFile }
jar {
	dependsOn tasks.named('streamlineClasses')
	from(streamlineOutput)
	from('LICENSE') {
		rename { "${it}_${licenseArchiveSuffix}" }
	}
	from('LICENSE-EXCEPTIONS')
	from('THIRD_PARTY_LICENSES') {
		into 'META-INF/licenses'
	}
}

def distributionVersion = providers.provider { project.version.toString() }
def shaderProgramManifestFile = file('shaders/programs.json')
def distributionShaderAbiFile = file('shaders/abi.json')
def nativeRuntimeNames = [
		'prime_nrd.dll',
		'amd_fidelityfx_vk.dll',
		'prime_dlss_rr.dll',
		'nvngx_dlssd.dll',
		'nvngx_dlssg.dll',
		'sl.common.dll',
		'sl.interposer.dll',
		'sl.pcl.dll',
		'sl.reflex.dll',
		'sl.dlss_g.dll',
		'NvLowLatencyVk.dll'
]
def verifyDistributionJar = tasks.register('verifyDistributionJar') {
	group = 'verification'
	description = 'Verifies that the distributable jar contains every runtime dependency.'
	dependsOn tasks.named('jar'), tasks.named('streamlineClasses')
	def archiveProvider = tasks.named('jar', Jar).flatMap { it.archiveFile }
	inputs.file(archiveProvider)
	inputs.file(shaderProgramManifestFile)
	inputs.file(distributionShaderAbiFile)
	inputs.files(streamlineOutput)
	def licenseFiles = [
		'LICENSE_prime': file('LICENSE'),
		'LICENSE-EXCEPTIONS': file('LICENSE-EXCEPTIONS')
	]
	inputs.files(licenseFiles.values())

	doLast {
		def archive = archiveProvider.get().asFile
		def names = new LinkedHashSet<String>()
		def duplicateNames = new LinkedHashSet<String>()
		new java.util.zip.ZipFile(archive).withCloseable { zip ->
			def entries = zip.entries()
			while (entries.hasMoreElements()) {
				def name = entries.nextElement().name
				if (!names.add(name)) {
					duplicateNames.add(name)
				}
			}
		}
		if (!duplicateNames.isEmpty()) {
			throw new GradleException("Distribution jar contains duplicate entries: ${duplicateNames}")
		}

		def requiredStreamlineEntries = new LinkedHashSet<String>()
		streamlineOutputRoots.findAll { it.isDirectory() }.each { outputRoot ->
			def paths = java.nio.file.Files.walk(outputRoot.toPath())
			try {
				paths.filter { java.nio.file.Files.isRegularFile(it) }.forEach { outputPath ->
					requiredStreamlineEntries.add(
							outputRoot.toPath()
									.relativize(outputPath)
									.toString()
									.replace(File.separator, '/'))
				}
			} finally {
				paths.close()
			}
		}
		if (requiredStreamlineEntries.isEmpty()) {
			throw new GradleException('Streamline runtime output is empty')
		}

		def shaderManifest = shaderManifestType.read(
				shaderProgramManifestFile)
		def requiredShaders = shaderManifest.artifacts.values().collect {
			"prime/shaders/${it.resource}".toString()
		}.sort()
		def required = [
			'fabric.mod.json',
			'prime.mixins.json',
			'prime.accesswidener',
			'LICENSE_prime',
			'LICENSE-EXCEPTIONS',
			'META-INF/licenses/README.md',
			'META-INF/licenses/APACHE-2.0.txt',
			'META-INF/licenses/FIDELITYFX-SDK-LICENSE.txt',
			'META-INF/licenses/NRD-LICENSE.txt',
			'META-INF/licenses/DLSS-SDK-LICENSE.txt',
			'META-INF/licenses/STREAMLINE-LICENSE.txt',
			'META-INF/licenses/ROBOCUTE-NOTICE.txt',
			'META-INF/licenses/NASA-DEEP-STAR-MAPS-2020-NOTICE.md',
			'META-INF/licenses/SKY-TRACER-NOTICE.md',
			'prime/starmap/starmap_2020_16k.json',
			'prime/starmap/starmap_2020_16k_0.bc6h.gz',
			'prime/starmap/starmap_2020_16k_1.bc6h.gz',
			'prime/starmap/starmap_2020_16k_2.bc6h.gz',
			'prime/starmap/starmap_2020_16k_3.bc6h.gz',
			'prime/shaders/manifest.sha256'
		] + nativeRuntimeNames.collect {
			"prime/natives/windows-x86_64/${it}".toString()
		} + requiredShaders + requiredStreamlineEntries
		def missing = required.findAll { !names.contains(it) }
		if (!missing.isEmpty()) {
			throw new GradleException("Distribution jar is missing runtime entries: ${missing}")
		}

		def shaderNames = names.findAll { it.startsWith('prime/shaders/') && it.endsWith('.spv') }
		def requiredShaderNames = requiredShaders as Set
		def unexpectedShaders = shaderNames.findAll { !requiredShaderNames.contains(it) }
		if (!unexpectedShaders.isEmpty()) {
			throw new GradleException(
					"Distribution jar contains undeclared Prime shaders: ${unexpectedShaders}")
		}

		new java.util.zip.ZipFile(archive).withCloseable { zip ->
			licenseFiles.each { entryName, sourceFile ->
				def packaged = zip.getInputStream(zip.getEntry(entryName)).withCloseable { it.readAllBytes() }
				if (!java.util.Arrays.equals(packaged, sourceFile.bytes)) {
					throw new GradleException("Distribution jar has outdated license text: ${entryName}")
				}
			}
			def contract = new groovy.json.JsonSlurper().parse(distributionShaderAbiFile).starmapContract
			def starmap = zip.getInputStream(zip.getEntry('prime/starmap/starmap_2020_16k.json'))
					.withCloseable { new groovy.json.JsonSlurper().parse(it) }
			def stripeNames = (0..<4).collect { "starmap_2020_16k_${it}.bc6h.gz".toString() }
			def mipNames = (1..<contract.mipLevels).collect { "starmap_2020_16k_mip${it}.bc6h.gz".toString() }
			if (starmap.version != 3 || starmap.source.sha256 != contract.sourceSha256
					|| starmap.image.width != contract.width || starmap.image.height != contract.height
					|| starmap.image.format != 'VK_FORMAT_BC6H_UFLOAT_BLOCK'
					|| starmap.image.colorSpace != 'D65 linear Rec.2020' || starmap.image.mipLevels != contract.mipLevels
					|| starmap.image.mips.collect { it.name } != mipNames
					|| starmap.image.blockWidth != 4 || starmap.image.blockHeight != 4
					|| starmap.image.blockBytes != 16
					|| starmap.image.stripes.collect { it.name } != stripeNames) {
				throw new GradleException('Distribution jar has invalid BC6H starmap format, source or stripes')
			}
			def expectedStarmap = ((stripeNames + mipNames).collect { "prime/starmap/${it}".toString() }
					+ ['prime/starmap/starmap_2020_16k.json']) as Set
			def actualStarmap = names.findAll { it.startsWith('prime/starmap/') && !it.endsWith('/') } as Set
			if (actualStarmap != expectedStarmap) {
				throw new GradleException('Distribution jar contains stale or undeclared starmap assets')
			}
			// Validate the shipped bytes, not only their presence. Stream both passes so the
			// BC6H mip chain never needs a second in-memory copy during packaging.
			(starmap.image.stripes + starmap.image.mips).eachWithIndex { stripe, index ->
				def name = "prime/starmap/${stripe.name}".toString()
				int level = Math.max(0, index - 3)
				int width = Math.max(1, (int) contract.width >> level)
				int height = level == 0 ? contract.stripeRows : Math.max(1, (int) contract.height >> level)
				long expectedBytes = Math.floorDiv(width + 3, 4) * (long) Math.floorDiv(height + 3, 4) * 16L
				if ((level == 0 && (stripe.firstRow != index * contract.stripeRows || stripe.rows != height))
						|| (level > 0 && (stripe.level != level || stripe.width != width || stripe.height != height
								|| !(stripe.sphericalEnergyRelativeError <= 0.01) || !(stripe.luminanceNrmse <= 0.06)
								|| !(stripe.rgbNrmse <= 0.08)))
						|| stripe.uncompressedBytes != expectedBytes) {
					throw new GradleException("Invalid starmap stripe layout: ${name}")
				}
				def compressedDigest = java.security.MessageDigest.getInstance('SHA-256')
				long compressedBytes = zip.getInputStream(zip.getEntry(name)).withCloseable { input ->
					new java.security.DigestInputStream(input, compressedDigest)
							.transferTo(java.io.OutputStream.nullOutputStream())
				}
				def compressedHash = java.util.HexFormat.of().formatHex(compressedDigest.digest())
				if (compressedBytes != stripe.compressedBytes || compressedHash != stripe.compressedSha256) {
					throw new GradleException("Corrupt packaged starmap ${name}: compressed bytes="
							+ "${compressedBytes}/${stripe.compressedBytes}, SHA-256="
							+ "${compressedHash}, expected ${stripe.compressedSha256}")
				}
				def decodedDigest = java.security.MessageDigest.getInstance('SHA-256')
				long decodedBytes = zip.getInputStream(zip.getEntry(name)).withCloseable { input ->
					new java.util.zip.GZIPInputStream(input).withCloseable { decoded ->
						new java.security.DigestInputStream(decoded, decodedDigest)
								.transferTo(java.io.OutputStream.nullOutputStream())
					}
				}
				def decodedHash = java.util.HexFormat.of().formatHex(decodedDigest.digest())
				if (decodedBytes != expectedBytes || decodedHash != stripe.uncompressedSha256) {
					throw new GradleException("Corrupt packaged starmap ${name}: decoded bytes="
							+ "${decodedBytes}/${expectedBytes}, SHA-256="
							+ "${decodedHash}, expected ${stripe.uncompressedSha256}")
				}
			}
			def metadataInput = zip.getInputStream(zip.getEntry('fabric.mod.json'))
			def metadata = metadataInput.withCloseable { new groovy.json.JsonSlurper().parse(it) }
			if (metadata.id != 'prime'
					|| metadata.version.toString() != distributionVersion.get()
					|| metadata.environment != 'client'
					|| metadata.license != 'GPL-3.0-only with Prime linking exceptions (see LICENSE-EXCEPTIONS)') {
				throw new GradleException(
						"Distribution jar has invalid Fabric metadata: id=${metadata.id}, "
								+ "version=${metadata.version}, environment=${metadata.environment}, "
								+ "license=${metadata.license}")
			}
			def expectedFabricDependencies = [
					'fabric-model-loading-api-v1',
					'fabric-renderer-api-v1',
					'fabric-renderer-indigo',
					'fabric-rendering-v1',
					'fabric-resource-loader-v1'
			] as Set
			def fabricDependencies = metadata.depends.keySet().findAll {
				it.startsWith('fabric-')
			} as Set
			if (fabricDependencies != expectedFabricDependencies) {
				throw new GradleException(
						"Distribution jar has an invalid Fabric API module contract: "
								+ "expected ${expectedFabricDependencies}, found ${fabricDependencies}")
			}

			nativeRuntimeNames.each { nativeName ->
				def entryName = "prime/natives/windows-x86_64/${nativeName}".toString()
				def input = zip.getInputStream(zip.getEntry(entryName))
				def header = input.withCloseable { it.readNBytes(2) }
				if (header.length != 2
						|| header[0] != (byte) 'M'
						|| header[1] != (byte) 'Z') {
					throw new GradleException(
							"Bundled native runtime is not a Windows PE image: ${entryName}")
				}
			}

			def invalidSpirv = shaderNames.findAll { shaderName ->
				def input = zip.getInputStream(zip.getEntry(shaderName))
				def header = input.withCloseable { it.readNBytes(Integer.BYTES) }
				header.length != Integer.BYTES
						|| java.nio.ByteBuffer.wrap(header)
								.order(java.nio.ByteOrder.LITTLE_ENDIAN)
								.getInt() != 0x07230203
			}
			if (!invalidSpirv.isEmpty()) {
				throw new GradleException("Distribution jar contains invalid SPIR-V files: ${invalidSpirv}")
			}
		}
		def forbidden = names.findAll {
			it.contains('_validation')
					|| it.toLowerCase(java.util.Locale.ROOT).contains('development')
					|| it.toLowerCase(java.util.Locale.ROOT).contains('_dev')
					|| it.endsWith('/nvngx_dlss.dll')
					|| it ==~ /.*\.(glsl|rgen|rchit|rmiss|rahit|comp)$/
		}
		if (!forbidden.isEmpty()) {
			throw new GradleException("Distribution jar contains build-only shader inputs: ${forbidden}")
		}
	}
}
