def licenseArchiveSuffix = project.name
jar {
	from('LICENSE') {
		rename { "${it}_${licenseArchiveSuffix}" }
	}
	from('THIRD_PARTY_LICENSES') {
		into 'META-INF/licenses'
	}
}

def distributionVersion = providers.provider { project.version.toString() }
def shaderProgramManifestFile = file('shaders/programs.json')
def verifyDistributionJar = tasks.register('verifyDistributionJar') {
	group = 'verification'
	description = 'Verifies that the distributable jar contains every runtime dependency.'
	dependsOn tasks.named('jar')
	def archiveProvider = tasks.named('jar', Jar).flatMap { it.archiveFile }
	inputs.file(archiveProvider)
	inputs.file(shaderProgramManifestFile)

	doLast {
		def archive = archiveProvider.get().asFile
		def names = new LinkedHashSet<String>()
		def duplicateNames = new LinkedHashSet<String>()
		new java.util.zip.ZipFile(archive).withCloseable { zip ->
			def entries = zip.entries()
			while (entries.hasMoreElements()) {
				def name = entries.nextElement().name
				if (!names.add(name)) {
					duplicateNames.add(name)
				}
			}
		}
		if (!duplicateNames.isEmpty()) {
			throw new GradleException("Distribution jar contains duplicate entries: ${duplicateNames}")
		}

		def shaderManifest = new groovy.json.JsonSlurper().parse(shaderProgramManifestFile)
		def requiredShaders = shaderManifest.artifacts.values().collect {
			"prime/shaders/${it.resource}".toString()
		}.sort()
		def required = [
			'fabric.mod.json',
			'prime.mixins.json',
			'prime.accesswidener',
			'LICENSE_prime',
			'META-INF/licenses/README.md',
			'META-INF/licenses/APACHE-2.0.txt',
			'META-INF/licenses/FIDELITYFX-SDK-LICENSE.txt',
			'META-INF/licenses/NRD-LICENSE.txt',
			'META-INF/licenses/DLSS-SDK-LICENSE.txt',
			'META-INF/licenses/STREAMLINE-LICENSE.txt',
			'META-INF/licenses/ROBOCUTE-NOTICE.txt',
			'META-INF/licenses/NASA-DEEP-STAR-MAPS-2020-NOTICE.md',
			'prime/starmap/starmap_2020_8k.json',
			'prime/starmap/starmap_2020_8k_0.rgba16f.gz',
			'prime/starmap/starmap_2020_8k_1.rgba16f.gz',
			'prime/starmap/starmap_2020_8k_2.rgba16f.gz',
			'prime/starmap/starmap_2020_8k_3.rgba16f.gz',
			'prime/natives/windows-x86_64/prime_nrd.dll',
			'prime/natives/windows-x86_64/amd_fidelityfx_vk.dll',
			'prime/natives/windows-x86_64/prime_dlss_rr.dll',
			'prime/natives/windows-x86_64/nvngx_dlssd.dll',
			'prime/natives/windows-x86_64/nvngx_dlssg.dll',
			'prime/natives/windows-x86_64/sl.common.dll',
			'prime/natives/windows-x86_64/sl.interposer.dll',
			'prime/natives/windows-x86_64/sl.pcl.dll',
			'prime/natives/windows-x86_64/sl.reflex.dll',
			'prime/natives/windows-x86_64/sl.dlss_g.dll',
			'prime/natives/windows-x86_64/NvLowLatencyVk.dll',
			'prime/shaders/manifest.sha256'
		] + requiredShaders
		def missing = required.findAll { !names.contains(it) }
		if (!missing.isEmpty()) {
			throw new GradleException("Distribution jar is missing runtime entries: ${missing}")
		}

		def shaderNames = names.findAll { it.startsWith('prime/shaders/') && it.endsWith('.spv') }
		def requiredShaderNames = requiredShaders as Set
		def unexpectedShaders = shaderNames.findAll { !requiredShaderNames.contains(it) }
		if (!unexpectedShaders.isEmpty()) {
			throw new GradleException(
					"Distribution jar contains undeclared Prime shaders: ${unexpectedShaders}")
		}

		new java.util.zip.ZipFile(archive).withCloseable { zip ->
			def metadataInput = zip.getInputStream(zip.getEntry('fabric.mod.json'))
			def metadata = metadataInput.withCloseable { new groovy.json.JsonSlurper().parse(it) }
			if (metadata.id != 'prime'
					|| metadata.version.toString() != distributionVersion.get()
					|| metadata.environment != 'client') {
				throw new GradleException(
						"Distribution jar has invalid Fabric metadata: id=${metadata.id}, "
								+ "version=${metadata.version}, environment=${metadata.environment}")
			}
			def expectedFabricDependencies = [
					'fabric-model-loading-api-v1',
					'fabric-renderer-api-v1',
					'fabric-renderer-indigo',
					'fabric-rendering-v1',
					'fabric-resource-loader-v1'
			] as Set
			def fabricDependencies = metadata.depends.keySet().findAll {
				it.startsWith('fabric-')
			} as Set
			if (fabricDependencies != expectedFabricDependencies) {
				throw new GradleException(
						"Distribution jar has an invalid Fabric API module contract: "
								+ "expected ${expectedFabricDependencies}, found ${fabricDependencies}")
			}

			def nativeInput = zip.getInputStream(zip.getEntry('prime/natives/windows-x86_64/prime_nrd.dll'))
			def nativeHeader = nativeInput.withCloseable { it.readNBytes(2) }
			if (nativeHeader.length != 2 || nativeHeader[0] != (byte) 'M' || nativeHeader[1] != (byte) 'Z') {
				throw new GradleException('Bundled NRD bridge is not a Windows PE image')
			}
			def fsrNativeInput = zip.getInputStream(
					zip.getEntry('prime/natives/windows-x86_64/amd_fidelityfx_vk.dll'))
			def fsrNativeHeader = fsrNativeInput.withCloseable { it.readNBytes(2) }
			if (fsrNativeHeader.length != 2
					|| fsrNativeHeader[0] != (byte) 'M'
					|| fsrNativeHeader[1] != (byte) 'Z') {
				throw new GradleException('Bundled FidelityFX library is not a Windows PE image')
			}
			[
					'prime/natives/windows-x86_64/prime_dlss_rr.dll',
					'prime/natives/windows-x86_64/nvngx_dlssd.dll',
					'prime/natives/windows-x86_64/nvngx_dlssg.dll',
					'prime/natives/windows-x86_64/sl.common.dll',
					'prime/natives/windows-x86_64/sl.interposer.dll',
					'prime/natives/windows-x86_64/sl.pcl.dll',
					'prime/natives/windows-x86_64/sl.reflex.dll',
					'prime/natives/windows-x86_64/sl.dlss_g.dll',
					'prime/natives/windows-x86_64/NvLowLatencyVk.dll'
			].each { rrNativeName ->
				def rrNativeInput = zip.getInputStream(zip.getEntry(rrNativeName))
				def rrNativeHeader = rrNativeInput.withCloseable { it.readNBytes(2) }
				if (rrNativeHeader.length != 2
						|| rrNativeHeader[0] != (byte) 'M'
						|| rrNativeHeader[1] != (byte) 'Z') {
					throw new GradleException("Bundled NVIDIA runtime is not a Windows PE image: ${rrNativeName}")
				}
			}

			def invalidSpirv = shaderNames.findAll { shaderName ->
				def input = zip.getInputStream(zip.getEntry(shaderName))
				def header = input.withCloseable { it.readNBytes(Integer.BYTES) }
				header.length != Integer.BYTES
						|| java.nio.ByteBuffer.wrap(header)
								.order(java.nio.ByteOrder.LITTLE_ENDIAN)
								.getInt() != 0x07230203
			}
			if (!invalidSpirv.isEmpty()) {
				throw new GradleException("Distribution jar contains invalid SPIR-V files: ${invalidSpirv}")
			}
		}
		def forbidden = names.findAll {
			it.contains('_validation')
					|| it.toLowerCase(java.util.Locale.ROOT).contains('development')
					|| it.toLowerCase(java.util.Locale.ROOT).contains('_dev')
					|| it.endsWith('/nvngx_dlss.dll')
					|| it ==~ /.*\.(glsl|rgen|rchit|rmiss|rahit|comp)$/
		}
		if (!forbidden.isEmpty()) {
			throw new GradleException("Distribution jar contains build-only shader inputs: ${forbidden}")
		}
	}
}
